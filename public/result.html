<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submission Result</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial; background:#f5f5f7; padding:60px 20px; }
    .card { max-width:720px; margin:0 auto; background:#fff; border-radius:18px; padding:36px; box-shadow:0 4px 16px rgba(0,0,0,.06); }
    h1 { margin:0 0 12px; }
    .pill { display:inline-block; padding:6px 12px; border-radius:999px; background:#eef2ff; }
    .ok { background:#e7f8ee; }
    .no { background:#fdeeee; }
    .meta { color:#666; margin-top:6px; }
    pre { white-space:pre-wrap; word-wrap:break-word; }
    a.button { display:inline-block; margin-top:24px; padding:12px 20px; border-radius:999px; background:#0071e3; color:#fff; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Review Result</h1>
    <div id="status"></div>
    <div class="meta" id="meta"></div>
    <h3 style="margin-top:24px;">Rationale</h3>
    <pre id="rationale"></pre>
    <a class="button" href="/">Back to form</a>
  </div>

  <script>
    (function(){
      const data = sessionStorage.getItem('belonging-review');
      if (!data) {
        document.getElementById('status').innerHTML = 'No review data found.';
        return;
      }
      const { cultureId, review } = JSON.parse(data);
      const pill = document.createElement('span');
      pill.className = 'pill ' + (review?.qualifies ? 'ok' : 'no');
      pill.textContent = review?.qualifies ? 'Qualifies' : 'Does not qualify';
      document.getElementById('status').appendChild(pill);
      document.getElementById('meta').textContent =
        `Culture #${cultureId} • Category: ${review?.category} • Score: ${review?.score}`;
      document.getElementById('rationale').textContent = review?.rationale || '';
    })();
  </script>
</body>
</html>
